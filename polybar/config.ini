[colors]
; Material You dark tonal palette
background = #1C1B1F
background-alt = #2A2930
foreground = #E6E1E5
primary = #A4C3FF
secondary = #C3C7CF
alert = #FFB4AB
disabled = #9A9BA2
transparent = #00000000

[bar/google-top]
width = 66%
height = 36pt
offset-x = 17%
offset-y = 12pt

bottom = false
fixed-center = true
wm-restack = ewmh
override-redirect = false
enable-struts = true

radius = 18pt
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0pt
border-size = 0pt
border-color = ${colors.transparent}
border-right-color = ${colors.transparent}
border-left-color = ${colors.transparent}
border-right-size = 6pt
border-left-size = 6pt
border-bottom-size = 6pt
border-bottom-color = ${colors.transparent}

padding-left = 4
padding-right = 4
module-margin = 2

font-0 = "Noto Sans:size=11:weight=bold;3"
font-1 = "Symbols Nerd Font:size=13;3"
font-2 = "Noto Sans CJK TC:size=12;3"

modules-left = power xworkspaces
modules-center = date
modules-right = filesystem pulseaudio memory cpu tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/power]
type = custom/text
content = "⏻  "
content-foreground = ${colors.secondary}
click-left = xfce4-session-logout
content-padding = 1

[module/xworkspaces]
type = internal/xworkspaces

label-active = ●
label-active-foreground = ${colors.primary}
label-active-padding = 1

label-occupied = ●
label-occupied-foreground = ${colors.secondary}
label-occupied-padding = 1

label-urgent = ●
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

label-empty = •
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = 󰇊 %percentage_used%%
label-mounted-foreground = ${colors.secondary}
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = 󰕿 %percentage%%
label-volume-foreground = ${colors.secondary}
label-muted = 󰕿 muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.secondary}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.secondary}
label = %percentage%%

;[module/wlan]
;type = internal/network
;interval = 3
;interface = enp0s3
;label-connected = "󰈀 %local_ip%"
;label-connected-foreground = ${colors.primary}
;label-disconnected = "󰈀 offline"
;label-disconnected-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 1
date = %I:%M %p
date-alt = %A, %B %d
label = %date%
label-foreground = ${colors.foreground}

[module/tray]
type = internal/tray
tray-size = 18
tray-spacing = 6

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/dummy]
type = custom/text
format = " "

[bar/struthelper]
; Invisible full-width bar that reserves the whole top row for google-top
width = 100%
height = 54pt
offset-x = 0
offset-y = 0
background = #00000000
foreground = #00000000
radius = 0
line-size = 0pt
border-size = 0pt
padding = 0
module-margin = 0
modules-left = dummy
override-redirect = false
enable-struts = true
wm-restack = ewmh
enable-ipc = true

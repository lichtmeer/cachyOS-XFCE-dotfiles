[input]
method = pulse
source = alsa_output.pci-0000_00_05.0.analog-stereo.monitor

# cava config for the conky-glance spectrum.
# Values are written to a file by cava-spectrum.sh, not drawn in a terminal.

[general]
bars = 24
framerate = 30

[output]
data_format = ascii
method = raw
channels = mono
raw_target = /dev/stdout
bit_format = 8bit

[color]
background = default
foreground = default

[smoothing]
noise_reduction = 77
monstercat = 0

[eq]
1 = 1
2 = 1
3 = 1
